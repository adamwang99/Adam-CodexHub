name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AdamCodexHub.sln

      - name: Build
        run: dotnet build AdamCodexHub.sln -c Release --no-restore

      - name: Test
        run: dotnet test AdamCodexHub.sln -c Release --no-build
