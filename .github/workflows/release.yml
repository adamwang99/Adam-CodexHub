name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AdamCodexHub.sln

      - name: Test
        run: dotnet test AdamCodexHub.sln -c Release --no-restore

      - name: Package Windows x64
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\package-release.ps1 -Version $version -RuntimeIdentifier win-x64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AdamCodexHub-${{ github.ref_name }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts -File |
            Where-Object { $_.Name -match '\.(zip|sha256)$' } |
            Select-Object -ExpandProperty FullName

          if ($assets.Count -ne 2) {
            throw "Expected ZIP and SHA-256 assets, found $($assets.Count)."
          }

          gh release create '${{ github.ref_name }}' `
            --verify-tag `
            --title "Adam CodexHub ${{ github.ref_name }}" `
            --generate-notes `
            $assets
